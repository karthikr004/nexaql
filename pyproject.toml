[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexaql"
version = "0.2.0"
description = "The query language built for AI agents — deterministic queries across any database with built-in privacy"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "NexaQL Contributors" },
]
keywords = ["query", "sql", "graphql", "data", "analytics", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Database",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "asyncpg>=0.30",
    "anthropic>=0.40",
    "click>=8.0",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[project.scripts]
nexaql = "nexaql.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexaql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
