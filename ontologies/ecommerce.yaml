# NexaQL Ontology — managed by NexaQL Admin
version: '1'
domain: ecommerce
description: 'E-commerce platform with customers, orders, products, and categories.
  Use the Role switcher to test access control across admin, manager, analyst, and
  anonymous roles.

  '
roles:
  admin:
    description: Full access to all nodes, fields, and rows
  manager:
    description: All nodes with region-filtered rows and all fields visible
  analyst:
    description: All nodes but no PII fields (email, phone) or financial amounts
access_functions:
  self_only:
    description: Only records created by the current user
    sql: '{field} = ''{user.user_id}'''
    requires:
    - user.user_id
  same_team:
    description: Records created by users on the same team
    sql: '{field} IN (SELECT user_id FROM employees WHERE team_id = ''{user.team_id}'')'
    requires:
    - user.team_id
  same_manager:
    description: Records created by users reporting to the same manager
    sql: '{field} IN (SELECT user_id FROM employees WHERE manager_id = ''{user.manager_id}'')'
    requires:
    - user.manager_id
  direct_reports:
    description: Records created by the user's direct reports
    sql: '{field} IN (SELECT user_id FROM employees WHERE manager_id = ''{user.user_id}'')'
    requires:
    - user.user_id
  region_match:
    description: Records where region matches the user's region
    sql: '{field} = ''{user.region}'''
    requires:
    - user.region
  department_match:
    description: Records created by users in the same department
    sql: '{field} IN (SELECT user_id FROM employees WHERE department = ''{user.department}'')'
    requires:
    - user.department
nodes:
  employee:
    table: employees
    description: Internal users/employees who create and manage records.
    primary_key: user_id
    fields:
      user_id:
        type: string
        description: Unique employee identifier.
        filterable: true
      name:
        type: string
        description: Employee full name.
        filterable: true
      email:
        type: string
        description: Employee email.
        filterable: true
        pii: true
        mask_with: email
      manager_id:
        type: string
        description: ID of the employee's manager.
        filterable: true
      region:
        type: string
        description: Employee's region.
        filterable: true
      department:
        type: string
        description: Department name.
        filterable: true
      team_id:
        type: string
        description: Team identifier.
        filterable: true
      level:
        type: string
        description: Seniority level (L1-L10).
        filterable: true
      job_role:
        type: string
        description: Job title/role.
        filterable: true
    visible_to:
    - admin
  customer:
    table: customers
    description: Registered customer or organization
    primary_key: id
    fields:
      id:
        type: integer
        description: Unique customer identifier.
        filterable: true
      name:
        type: string
        description: Full name of the customer.
        filterable: true
      email:
        type: string
        description: Email address.
        filterable: true
        visible_to:
        - manager
        - admin
        pii: true
        mask_with: email
      phone:
        type: string
        description: Phone number.
        visible_to:
        - manager
        - admin
        pii: true
        mask_with: phone
      region:
        type: string
        description: Geographic region (US-EAST, US-WEST, EU, APAC).
        filterable: true
      status:
        type: enum
        description: Account status.
        filterable: true
        values:
        - ACTIVE
        - INACTIVE
        - SUSPENDED
      created_at:
        type: date
        description: Date the account was created.
        filterable: true
      lifetime_value:
        type: numeric
        description: Total amount spent across all orders.
        filterable: true
        visible_to:
        - manager
        - admin
      created_by:
        type: string
        description: User who created this record.
        filterable: true
        visible_to:
        - manager
        - admin
    edges:
      orders:
        node: order
        description: Orders placed by this customer.
        join_type: LEFT
        join_steps:
        - table: orders
          alias_key: order
          condition: '{order}.customer_id = {customer}.id'
    special_filters:
      high_value:
        description: Customers whose lifetime_value exceeds a given amount.
        type: integer
        sql: '{customer}.lifetime_value > {value}'
      active:
        description: Only active customers.
        sql: '{customer}.status = ''ACTIVE'''
    visible_to:
    - analyst
    - manager
    - admin
    row_policies:
    - function: region_match
      field: region
      roles:
      - manager
      except_roles:
      - admin
  order:
    table: orders
    description: Customer orders.
    primary_key: id
    fields:
      id:
        type: integer
        description: Unique order identifier.
        filterable: true
      customer_id:
        type: integer
        description: FK to customers.
        filterable: true
        visible_to:
        - analyst
        - manager
        - admin
      status:
        type: enum
        description: Current order status.
        filterable: true
        values:
        - PENDING
        - CONFIRMED
        - SHIPPED
        - DELIVERED
        - CANCELLED
      ordered_at:
        type: date
        description: Date the order was placed.
        filterable: true
      shipped_at:
        type: date
        description: Date the order was shipped.
        filterable: true
      total_amount:
        type: numeric
        description: Total order value.
        filterable: true
        visible_to:
        - manager
        - admin
      created_by:
        type: string
        description: User who created this record.
        filterable: true
        visible_to:
        - manager
        - admin
    edges:
      customer:
        node: customer
        description: The customer who placed this order.
        join_steps:
        - table: customers
          alias_key: customer
          condition: '{customer}.id = {order}.customer_id'
      items:
        node: order_item
        description: Line items in this order.
        join_type: LEFT
        join_steps:
        - table: order_items
          alias_key: order_item
          condition: '{order_item}.order_id = {order}.id'
    special_filters:
      large_order:
        description: Orders with total_amount exceeding a given value.
        type: integer
        sql: '{order}.total_amount > {value}'
    row_policies:
    - function: same_team
      field: customer_id
      roles:
      - manager
      except_roles:
      - admin
  order_item:
    table: order_items
    description: Individual line items within an order.
    primary_key: id
    fields:
      id:
        type: integer
        description: Unique line-item identifier.
        filterable: true
      order_id:
        type: integer
        description: FK to orders.
        filterable: true
      product_id:
        type: integer
        description: FK to products.
        filterable: true
      quantity:
        type: integer
        description: Number of units ordered.
        filterable: true
      unit_price:
        type: numeric
        description: Price per unit at the time of purchase.
        filterable: true
        visible_to:
        - manager
        - admin
      line_total:
        type: numeric
        description: Line total (quantity * unit_price).
        filterable: true
        visible_to:
        - manager
        - admin
      created_by:
        type: string
        description: User who created this record.
        filterable: true
        visible_to:
        - manager
        - admin
    edges:
      order:
        node: order
        description: The parent order.
        join_steps:
        - table: orders
          alias_key: order
          condition: '{order}.id = {order_item}.order_id'
      product:
        node: product
        description: The product purchased.
        join_steps:
        - table: products
          alias_key: product
          condition: '{product}.id = {order_item}.product_id'
  product:
    table: products
    description: Products available for sale.
    primary_key: id
    fields:
      id:
        type: integer
        description: Unique product identifier.
        filterable: true
      name:
        type: string
        description: Product name.
        filterable: true
      sku:
        type: string
        description: Stock keeping unit code.
        filterable: true
      price:
        type: numeric
        description: Current retail price.
        filterable: true
        visible_to:
        - analyst
        - manager
        - admin
      category_id:
        type: integer
        description: FK to categories.
        filterable: true
      is_active:
        type: boolean
        description: Whether the product is currently listed.
        filterable: true
      created_at:
        type: date
        description: Date the product was added.
        filterable: true
      created_by:
        type: string
        description: User who created this record.
        filterable: true
        visible_to:
        - manager
        - admin
    edges:
      category:
        node: category
        description: The category this product belongs to.
        join_steps:
        - table: categories
          alias_key: category
          condition: '{category}.id = {product}.category_id'
      order_items:
        node: order_item
        description: Line items that reference this product.
        join_type: LEFT
        join_steps:
        - table: order_items
          alias_key: order_item
          condition: '{order_item}.product_id = {product}.id'
    special_filters:
      in_stock:
        description: Only active/listed products.
        sql: '{product}.is_active = TRUE'
  category:
    table: categories
    description: Product categories.
    primary_key: id
    fields:
      id:
        type: integer
        description: Unique category identifier.
        filterable: true
      name:
        type: string
        description: Category name.
        filterable: true
      slug:
        type: string
        description: URL-friendly category slug.
      description:
        type: string
        description: Human-readable description of the category.
      created_by:
        type: string
        description: User who created this record.
        filterable: true
        visible_to:
        - manager
        - admin
    edges:
      products:
        node: product
        description: Products in this category.
        join_type: LEFT
        join_steps:
        - table: products
          alias_key: product
          condition: '{product}.category_id = {category}.id'
